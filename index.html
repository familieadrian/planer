<script>
/* Direktlinks: ?seite=einkauf (oder kalender, schule, essen, sterne) öffnet gleich diese Seite –
   auch als Verknüpfung auf dem Startbildschirm (eigenes Manifest pro Seite). */
(function(){ var q = new URLSearchParams(location.search); var v = (q.get('seite') || q.get('view') || '').toLowerCase();
  var ok = ['heute','kalender','schule','einkauf','essen','sterne'].indexOf(v) >= 0;
  if (ok && !location.hash) history.replaceState(null, '', location.pathname + location.search + '#' + v);
  var l = document.createElement('link'); l.rel = 'manifest'; l.href = ok && v !== 'heute' ? 'manifest-' + v + '.webmanifest' : 'manifest.webmanifest'; document.head.appendChild(l); })();
</script>

html,body{height:100%;margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
#root{height:100%}
.app{height:100%;display:flex}
.nav{width:104px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:20px;overflow:auto}
.logo{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.nav>a{width:84px;padding:10px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;font-size:13px;font-weight:700;color:var(--muted)}
.nav>a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:800}
.nav .sync{margin-top:auto;font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:0 8px;line-height:1.3}
.main{flex:1;min-width:0;overflow:auto;padding-block:22px 28px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:30px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:16px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{min-height:48px;padding:0 18px;border:none;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:44px;height:44px;flex-shrink:0;border:none;border-radius:12px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}.iconbtn:disabled{opacity:.3}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:14px;font-weight:800}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:5px;gap:4px;border:1px solid var(--line)}
.seg button{display:flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:8px 18px;min-height:44px;font-size:16px;font-weight:800;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--muted);min-width:0}
.field input,.field select,.input{height:48px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px;font-weight:700;color:var(--fg);background:var(--surface);box-sizing:border-box;width:100%;min-width:0}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;box-sizing:border-box}
.avatar-btn{width:52px;height:52px;font-size:19px;border:3px solid transparent;padding:0}
.famring{width:100%;height:100%;border-radius:50%;padding:4px;box-sizing:border-box;display:flex}.faminner{flex:1;border-radius:50%;background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center}.faminner svg{width:58%;height:58%}
.empty{border:2px dashed var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);font-weight:700}
.empty strong{color:var(--fg);font-size:17px}
.clock{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.todaychips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tchip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.tchip.exam{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink);font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cols{display:grid;grid-template-columns:repeat(var(--ncols,5),minmax(0,1fr));gap:14px;align-items:stretch;flex:1}
.col{background:var(--surface);border-radius:24px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.colhead{display:flex;align-items:center;gap:12px;padding-bottom:4px}
.colhead .avatar{width:52px;height:52px;font-size:22px;border:3px solid}
.colname{font-size:19px;font-weight:800}
.stars{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:800}
.task{display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 10px;border-radius:16px;box-sizing:border-box;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface)}
.task .ic{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.task .lbl{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.2}
.task .chk{width:30px;height:30px;flex-shrink:0;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:var(--surface)}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress>div{height:100%;border-radius:5px;transition:width .3s}
.done-badge{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:8px;font-size:15px;font-weight:800}
.iconpick{display:flex;flex-wrap:wrap;gap:4px}
.iconpick button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.iconpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.split{display:flex;gap:20px;align-items:flex-start}
.split>.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.split>aside{width:360px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;border:2px solid transparent;min-height:180px}
.day.today{border-color:var(--accent)}
.dayhead{display:flex;align-items:baseline;gap:6px;padding:0 4px 2px;font-weight:800}
.dayhead .n{font-size:26px}
.today .dayhead{color:var(--accent)}
.ev{border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;text-align:left;border:none;width:100%;color:var(--fg)}
.ev .t{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.ev .x{font-size:14px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.ev.exam{background:var(--warn-soft)}
.ev.exam .x{color:var(--warn-ink)}
.addday{border:none;background:transparent;color:var(--muted);border-radius:10px;min-height:36px;font-weight:800;font-size:13px;margin-top:auto}
.tt{display:grid;gap:8px}
.tt .h{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:8px 0;border-radius:12px;background:var(--surface-2);font-weight:800}
.tt .h.today{background:var(--accent);color:var(--accent-fg)}
.tt .tm{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.tt .tm small{font-size:12px;color:var(--muted);font-weight:700}
.cell{position:relative;min-height:56px;border-radius:14px;border:3px solid transparent;display:flex;align-items:center;justify-content:center;padding:4px 8px;text-align:center;font-size:15px;font-weight:800;color:var(--fg);overflow-wrap:anywhere}
.cell.empty-cell{background:transparent;border:2px dashed var(--line);color:var(--muted);font-weight:600}
.cell.exam{border-color:var(--warn)}
.fercount{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-size:15px;font-weight:600}.fercount b{font-weight:800}.fercount .fshort{display:none}@media (max-width:600px){.fercount .flong{display:none}.fercount .fshort{display:inline}}
.cell .badge{position:absolute;top:3px;right:4px;z-index:2;background:var(--warn);color:var(--on-m);font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;line-height:1.4}
.cell.exam{padding-top:14px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;background:var(--surface-2);min-width:0}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li.adm{flex-wrap:wrap}.li.adm .tx span{font-size:13px;color:var(--muted)}.li.dev .tx{flex:1 1 180px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}.swatch span{width:100%;height:100%;border-radius:50%;display:block}.swatch:disabled{opacity:.25;cursor:not-allowed}
.avatar-btn:disabled{cursor:not-allowed}
.whopick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.whocard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:20px;background:var(--surface-2);border:2px solid var(--line);font-size:17px;color:var(--fg);cursor:pointer;font-family:inherit}.whocard:hover{border-color:var(--accent)}
.li .tx b{font-size:16px}
.li .tx span{font-size:13px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{flex-shrink:0;font-size:13px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--surface);color:var(--muted)}
.count.soon{background:var(--warn-soft);color:var(--warn-ink)}
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 6px 6px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-width:0}
.item>button.main-tap{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:none;background:transparent;text-align:left;padding:4px 0;min-height:44px}
.item .circle{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.item.done{background:var(--surface-2);border-color:transparent}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item.done .circle{background:var(--accent);border-color:var(--accent)}
.nm{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.mic{width:56px;height:56px;flex-shrink:0;border:none;border-radius:16px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center}
.mic.on{background:var(--danger);color:#FFFFFF}
.mic.on svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.mic.on svg{animation:none}.progress>div{transition:none}}
.hint{padding:10px 14px;border-radius:14px;font-size:14px;font-weight:700;background:var(--ok-soft);color:var(--ok-ink)}
.hint.warn{background:var(--warn-soft);color:var(--warn-ink)}
.meals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.meal{background:var(--surface);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;border:3px solid transparent;text-align:left;color:var(--fg);min-width:0}
.meal.today{border-color:var(--accent)}
.meal .mh{display:flex;align-items:baseline;justify-content:space-between;font-weight:800}
.meal .mh small{font-size:13px;color:var(--muted);font-weight:700}
.meal .pic{border-radius:16px;background:var(--food-bg);aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.meal .pic.none{border:2px dashed var(--food-line);background:transparent;color:var(--muted);font-weight:800;font-size:14px}
.meal .dish{font-size:16px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.art{display:block;width:78%;max-width:100%}
.art svg{display:block;width:100%;height:auto}
.foods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.food{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:16px;border:2px solid var(--food-line);background:var(--food-bg);color:var(--fg)}
.food .art{width:100%}
.food span{font-size:12px;font-weight:800;line-height:1.15;text-align:center}
.thumb{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--food-bg);display:flex;align-items:center;justify-content:center}

<body>
<div id="root"><div class="loading" style="padding:24px">Familienboard wird geladen …</div></div>

<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const { html, render, useState, useEffect, useRef } = htmPreact;

/* ---------- Familie ---------- */
/* Farbvorschläge für Personen (hell/dunkel als CSS-Variablen --pm-<k>/--pt-<k>) */
const PALETTE = [['blau','Blau'],['beere','Beere'],['petrol','Petrol'],['orange','Orange'],['gruen','Grün'],['lila','Lila'],['rot','Rot'],['braun','Braun'],['himmel','Himmelblau'],['oliv','Oliv'],['pink','Pink'],['grau','Grau']];
const DEFAULT_MEMBERS = [
  { id:'klaus', name:'Klaus', role:'Papa', kid:false, color:'blau', short:'K' },
  { id:'helena', name:'Helena', role:'Mama', kid:false, color:'beere', short:'H' },
  { id:'dorothea', name:'Dorothea', kid:true, school:true, color:'petrol', short:'D', aliases:'doro' },
  { id:'marlene', name:'Marlene', kid:true, school:true, speak:true, color:'orange', short:'M' },
  { id:'clemens', name:'Clemens', kid:true, speak:true, color:'gruen', short:'C' }
];
/* Diese Listen werden beim Laden von config/members neu befüllt (gleiche Objekte, damit alle Stellen aktuell bleiben) */
const MEMBERS = [], WHO = [], SCHOOL = [], byId = {};
const PNAMES = {};
let membersSig = '';
function applyMembers(doc){
  const list = doc && Array.isArray(doc.list) && doc.list.some(m => !m.hidden) ? doc.list : DEFAULT_MEMBERS;
  const sig = JSON.stringify(list); if (sig === membersSig) return false; membersSig = sig;
  MEMBERS.length = 0; WHO.length = 0; SCHOOL.length = 0; Object.keys(byId).forEach(k => delete byId[k]); Object.keys(PNAMES).forEach(k => delete PNAMES[k]);
  list.forEach(x => { const m = Object.assign({}, x); byId[m.id] = m; if (!m.hidden) { MEMBERS.push(m); WHO.push(m); if (m.school) SCHOOL.push(m); }
    const nm = [m.name].concat(m.role ? [m.role] : []).concat((m.aliases || '').split(',')).map(v => v.trim().toLowerCase()).filter(Boolean);
    if (/^(papa|mama)$/.test((m.role || '').toLowerCase())) nm.push(m.role.toLowerCase() + 'i');
    PNAMES[m.id] = Array.from(new Set(nm)); });
  const fam = { id:'familie', name:'Alle' }; WHO.push(fam); byId.familie = fam;
  try { document.documentElement.style.setProperty('--ncols', String(Math.max(1, MEMBERS.length))); } catch (e) {}
  return true;
}
applyMembers(null);
const mc = id => byId[id] && byId[id].color ? 'var(--pm-' + byId[id].color + ')' : 'var(--m-' + id + ')';
const mt = id => byId[id] && byId[id].color ? 'var(--pt-' + byId[id].color + ')' : 'var(--t-' + id + ')';
const ini = id => (byId[id] ? (byId[id].short || byId[id].name[0]) : '?');
const parentId = () => (MEMBERS.find(m => !m.kid) || MEMBERS[0]).id;
const firstKid = () => (MEMBERS.find(m => m.kid) || MEMBERS[0]).id;

/* ---------- Datum ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const fromIso = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2], 12); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); return addDays(x, -((x.getDay()+6)%7)); };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const dm = d => d.getDate() + '.' + (d.getMonth()+1) + '.';
function kw(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate()+4-day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
const daysUntil = (s, now) => Math.round((fromIso(s) - fromIso(iso(now))) / 864e5);
const countdown = n => n === 0 ? 'heute' : n === 1 ? 'morgen' : 'in ' + n + ' Tagen';
/* Tagesabschnitte: Morgen 4–12, Mittag 12–18, Abend 18–4 Uhr (nach Mitternacht zählt noch zum Vortag) */
const SLOTS = [{ id:'morgen', name:'Morgen', adv:'morgens', icon:'sun', from:4 }, { id:'mittag', name:'Mittag', adv:'mittags', icon:'lunch', from:12 }, { id:'abend', name:'Abend', adv:'abends', icon:'moon', from:18 }];
const slotIdx = id => SLOTS.findIndex(x => x.id === id);
const slotOf = d => { const h = d.getHours(); const id = h < 4 ? 'abend' : h < 12 ? 'morgen' : h < 18 ? 'mittag' : 'abend'; return { id, day: iso(h < 4 ? addDays(d, -1) : d) }; };
const copyR = r => { const o = { tag: Object.assign({}, (r || {}).tag || {}) }; SLOTS.forEach(x => { o[x.id] = Object.assign({}, (r || {})[x.id] || {}); }); return o; };

/* ---------- Sterne, Level & Belohnungen ---------- */
const LEVELS = [
  { at:0, name:'Starter' },
  { at:10, name:'Helfer', reward:'Lieblingsnachtisch aussuchen' },
  { at:25, name:'Profi', reward:'30 Minuten länger aufbleiben' },
  { at:50, name:'Held', reward:'Lieblingsessen für den Essensplan bestimmen' },
  { at:80, name:'Superheld', reward:'Filmabend – du suchst den Film aus' },
  { at:120, name:'Champion', reward:'Ausflug allein mit Mama oder Papa' },
  { at:175, name:'Legende', reward:'Kleines Geschenk (Buch, Spiel …)' },
  { at:250, name:'Meister', reward:'Wunsch-Tag: du planst den Tag' },
  { at:350, name:'Großmeister', reward:'Großer Wunsch nach Absprache' }
];
const FAMILY_GOALS = [
  { at:150, reward:'Pizza- und Spieleabend' },
  { at:400, reward:'Familienausflug, z. B. Schwimmbad' },
  { at:800, reward:'Großer Ausflug, z. B. Freizeitpark' }
];
const levelIdx = n => { let i = 0; LEVELS.forEach((l, k) => { if ((n || 0) >= l.at) i = k; }); return i; };
const weekDoc = d => 'pointsweek/' + iso(monday(d || new Date()));
let mem_ = null;
/* Sterne vergeben: Gesamtstand + Wochenstand, mit Glückwunsch beim Levelaufstieg */
function givePoints(points, deltas, date){
  const p = Object.assign({}, points || {}); const wk = weekDoc(date ? fromIso(date) : new Date()); const w = Object.assign({}, (mem_ && mem_.docs[wk]) || {});
  Object.keys(deltas).forEach(id => { const d = deltas[id]; if (!d) return; const before = p[id] || 0;
    p[id] = r2(Math.max(0, before + d)); w[id] = r2(Math.max(0, (w[id] || 0) + d));
    const a = levelIdx(before), b = levelIdx(p[id]);
    if (b > a) setTimeout(() => toast('Level ' + (b + 1) + ' erreicht: ' + byId[id].name + ' ist jetzt ' + LEVELS[b].name + '!'), 600); });
  S.set('points/all', p); S.set(wk, w);
}

/* Sterne-Protokoll: jede vergebene Sterne-Portion als Eintrag (für Statistik und Korrektur) */
const logAll = () => Object.keys((mem_ && mem_.docs) || {}).filter(k => k.indexOf('starlog/') === 0).map(k => Object.assign({ id: k.slice(8) }, mem_.docs[k]));
function logAdd(e){ S.add('starlog', Object.assign({ at: Date.now() }, e)); }
function logDrop(match){ logAll().filter(match).forEach(e => S.del('starlog/' + e.id)); }
/* Eintrag korrigieren: löschen (who=null) oder einer anderen Person geben */
function logFix(e, to, points){
  if (points === undefined) { toast('Einen Moment, Sterne werden noch geladen …'); return; }
  const dl = { [e.who]: -e.stars }; if (to) dl[to] = r2((dl[to] || 0) + e.stars);
  givePoints(points, dl, e.date);
  if (e.kind === 'routine') { const ck = 'checks/' + e.date; const c = Object.assign({}, mem_.docs[ck] || {}); const R = mem_.docs['config/routines'] || {}; const md = e.mode || 'morgen';
    const lst = (R[md] || {})[e.who] || []; let i = lst.findIndex((t, j) => t.label === e.what && c[e.who + '-' + md + '-' + j]);
    if (i < 0 && e.idx != null && c[e.who + '-' + md + '-' + e.idx]) i = e.idx;
    if (i >= 0) delete c[e.who + '-' + md + '-' + i];
    if (to) { const tl = (R[md] || {})[to] || []; const j = tl.findIndex((t, k) => t.label === e.what && !c[to + '-' + md + '-' + k]); if (j >= 0) c[to + '-' + md + '-' + j] = true; }
    S.set(ck, c); }
  if (e.kind === 'ptask' && mem_.docs['ptasks/' + e.ptask]) { const b = Object.assign({}, mem_.docs['ptasks/' + e.ptask]);
    if (to) b.who = to; else { b.done = false; b.doneOn = null; } S.set('ptasks/' + e.ptask, b); }
  if (e.todo && mem_.docs['todos/' + e.todo]) { const t = Object.assign({ id: e.todo }, mem_.docs['todos/' + e.todo]); const k = e.key || 'once';
    const ws = whoOf(t, e.key && e.key !== 'once' ? e.key : (t.doneOn || e.date)).filter(x => x !== e.who); if (to && ws.indexOf(to) < 0) ws.push(to);
    const done = Object.assign({}, t.done || {}); if (ws.length) done[k] = ws.length === 1 ? ws[0] : ws; else delete done[k];
    const body = Object.assign({}, t, { done }); delete body.id; if (k === 'once') body.doneOn = ws.length ? (t.doneOn || e.date) : null; S.set('todos/' + e.todo, body); }
  if (to) { const b = Object.assign({}, e, { who: to }); delete b.id; S.set('starlog/' + e.id, b); } else S.del('starlog/' + e.id);
  toast(to ? 'Jetzt bei ' + byId[to].name + ' eingetragen' : 'Abgewählt, Sterne abgezogen');
}
/* Sterne, zu denen keine Aufgabe mehr bekannt ist (z. B. gelöschte Aufgaben), als eigener Eintrag – damit auch sie korrigierbar sind */
function backfillRest(){
  const P = mem_.docs['points/all'] || {}; const logs = logAll(); const today = iso(new Date());
  MEMBERS.forEach(m => { const own = 'b-x-' + m.id;
    const sumOthers = r2(logs.filter(e => e.who === m.id && e.id !== own).reduce((a, e) => a + (e.stars || 0), 0));
    const cur = logs.find(e => e.id === own && e.who === m.id);
    const diff = r2((P[m.id] || 0) - sumOthers);
    if (diff > 0.01) { if (!cur || Math.abs((cur.stars || 0) - diff) > 0.01) S.set('starlog/' + own, { who: m.id, stars: diff, what: 'Ältere Sterne', kind: 'alt', date: cur ? cur.date : today, at: 0 }); }
    else if (cur) S.del('starlog/' + own); });
}
/* Ältere Erledigungen (vor Einführung des Protokolls) aus Häkchen und Aufgaben nachtragen */
function backfillLog(){
  if (!mem_) return; const docs = mem_.docs; const logs = logAll(); const R = docs['config/routines'] || {};
  const has = f => logs.some(f);
  Object.keys(docs).filter(k => k.indexOf('checks/') === 0).forEach(k => { const date = k.slice(7); const c = docs[k] || {};
    Object.keys(c).forEach(key => { if (!c[key]) return; const m = /^([a-z]+)-(morgen|mittag|abend|tag)-(\d+)$/.exec(key); if (!m) return;
      const who = m[1], md = m[2], i = +m[3]; if (!byId[who]) return;
      const t = ((R[md] || {})[who] || [])[i]; const what = t ? t.label : 'Routine';
      if (has(e => e.kind === 'routine' && e.who === who && e.date === date && e.what === what)) return;
      S.set('starlog/b-r-' + date + '-' + who + '-' + md + '-' + i, { who, stars: byId[who].kid ? 1 : 0, what, kind: 'routine', mode: md, idx: i, date, at: 0 }); }); });
  Object.keys(docs).filter(k => k.indexOf('ptasks/') === 0).forEach(k => { const id = k.slice(7); const t = docs[k] || {};
    if (!t.done || !byId[t.who] || has(e => e.ptask === id)) return;
    S.set('starlog/b-p-' + id, { who: t.who, stars: byId[t.who].kid ? 1 : 0, what: t.label, kind: 'ptask', ptask: id, date: t.doneOn || t.date, at: 0 }); });
  Object.keys(docs).filter(k => k.indexOf('todos/') === 0).forEach(k => { const id = k.slice(6); const t = docs[k] || {}; const st = t.stars || 1;
    Object.keys(t.done || {}).forEach(key => { const w = t.done[key]; const list = Array.isArray(w) ? w : [w]; const date = key === 'once' ? (t.doneOn || t.date) : key; if (!date) return;
      list.forEach(who => { if (!byId[who] || has(e => e.todo === id && e.key === key && e.who === who)) return;
        S.set('starlog/b-t-' + id + '-' + key + '-' + who, { who, stars: r2(st / list.length), what: t.title, kind: 'todo', todo: id, key, date, team: list.length > 1 ? list : null, at: 0 }); }); }); });
  backfillRest();
}

/* ---------- Sprache verstehen: „Termin morgen um 15 Uhr Zahnarzt für Dorothea“ ---------- */
const NUMW = { ein:1, eins:1, eine:1, einen:1, zwei:2, drei:3, vier:4, fünf:5, sechs:6, sieben:7, acht:8, neun:9, zehn:10, elf:11, zwölf:12 };
const MONS = ['januar','februar','märz','april','mai','juni','juli','august','september','oktober','november','dezember'];
const WDS = ['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'];
function parseSpeech(text, now){
  now = now || new Date();
  let t = ' ' + String(text || '').toLowerCase().replace(/[,!?]/g, ' ').replace(/\s+/g, ' ') + ' ';

const BACKUP_KEEP = 14;

  quietly(() => { S.set(k, { at: Date.now(), docs: makeSnapshot() });
    Object.keys(mem.docs).filter(x => x.indexOf('backup/') === 0).sort().reverse().slice(BACKUP_KEEP).forEach(x => S.del(x)); });

async function restoreBackup(key){

  quietly(() => { const keep = b.docs;
    Object.keys(mem.docs).forEach(k => { if (k.indexOf('backup/') !== 0 && !(k in keep)) S.del(k); });

/* ---------- Rückgängig: jede Änderung merkt sich den vorherigen Stand ---------- */
const undoStack = []; let undoGroup = null; let undoQuiet = false;
function recordUndo(p){
  if (undoQuiet) return; const now = Date.now();
  if (!undoGroup || now - undoGroup.t > 900) { undoGroup = { t: now, items: {} }; undoStack.push(undoGroup); if (undoStack.length > 5) undoStack.shift(); }
  if (!(p in undoGroup.items)) undoGroup.items[p] = mem.docs[p] === undefined ? null : JSON.parse(JSON.stringify(mem.docs[p]));
  undoGroup.t = now; setTimeout(() => window.dispatchEvent(new CustomEvent('fb-undo')), 0);
}
function undoLast(){
  const g = undoStack.pop(); if (!g) return false; undoGroup = null; undoQuiet = true;
  try { Object.keys(g.items).forEach(p => { const v = g.items[p]; if (v === null) S.del(p); else S.set(p, v); }); } finally { undoQuiet = false; }
  window.dispatchEvent(new CustomEvent('fb-undo')); return true;
}

const S = {
  watchDoc(p, cb){ const f = () => cb(mem.docs[p]); mem.subs.add(f); f(); return () => mem.subs.delete(f); },
  watchCol(p, cb){
    const f = () => cb(Object.keys(mem.docs).filter(k => colOf(k) === p).map(k => Object.assign({ id: k.split('/').pop() }, mem.docs[k])));
    mem.subs.add(f); f(); return () => mem.subs.delete(f);
  },
  set(p, data){
    if (DEMO) return demoBlock();

  },
  add(col, data){

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1800, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej({ code:'image_rejected' }); };
    img.src = u;
  });
}
function parseJson(t){
  const s = String(t || '').trim();
  try { return JSON.parse(s); } catch (e) {}
  const f = s.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = s.search(/[\[{]/), b = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch (e) {} }

}

function EventImport({ now, onClose }){

  <//>`;

function FerienCount({ now }){
  const t = iso(now); const cur = FERIEN_HE.find(x => t >= x[0] && t <= x[1]);
  const diff = ds => Math.round((fromIso(ds) - fromIso(t)) / 864e5);
  let txt, big, short;
  if (cur) { const n = diff(cur[1]); big = n === 0 ? 'Letzter Tag' : 'Noch ' + n; txt = n === 0 ? cur[2] + ' – morgen geht die Schule wieder los' : (n === 1 ? 'Tag ' : 'Tage ') + cur[2]; short = n === 0 ? 'Ferien' : (n === 1 ? 'Tag' : 'Tage') + ' Ferien'; }

function TimetableImport({ kid, onClose }){
  const [file, setFile] = useState(null); const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [res, setRes] = useState(null);
  const run = async () => {
    setBusy(true); setErr(''); setRes(null);
    const prompt = 'Das Bild zeigt den Schul-Stundenplan eines Grundschulkindes (Montag bis Freitag). Lies ihn genau aus. ' +
      'Antworte nur mit JSON: {"times":["8:00","8:45",...],"days":[[...],[...],[...],[...],[...]]}. ' +
      '"times" = Beginn jeder Unterrichtsstunde (Zeile) von oben nach unten; sind keine Zeiten zu sehen, nimm "". ' +
      '"days" = genau 5 Listen (Mo, Di, Mi, Do, Fr), jede so lang wie "times": Fachname kurz auf Deutsch (z. B. "Deutsch", "Mathe", "Sport", "Kunst") oder null, wenn frei. Pausen als eigene Zeilen weglassen. Höchstens 10 Zeilen.';
    try {
      const r = await readImage(file, prompt);
      if (!r || !Array.isArray(r.times) || !Array.isArray(r.days) || !r.times.length) throw { code:'invalid_json' };
      const n = Math.min(r.times.length, 10);
      const days = [0,1,2,3,4].map(i => { const d = Array.isArray(r.days[i]) ? r.days[i] : []; return Array.from({ length: n }, (x, j) => (d[j] ? String(d[j]).trim() : null)); });
      setRes({ times: r.times.slice(0, n).map(t => (t ? String(t) : '')), days });

  };
  return html`<${Sheet} title=${'Stundenplan einlesen · ' + byId[kid].name} onClose=${onClose} wide>

          ${res.days.map(d => html`<div class=${'cell' + (d[ri] ? '' : ' empty-cell')} style=${d[ri] ? 'background:var(--tone-' + toneOf(d[ri]) + ')' : ''}>${d[ri] || '–'}</div>`)}`)}

  <//>`;

    if (wish) S.del('wishes/' + wish.id); toast(dish + ' zum ' + mealName(ml) + ' eingeplant'); };
  const del = i => { const o = dayPlan(mem_.docs['mealplan/' + ds]); o[ml] = o[ml].filter((x, j) => j !== i); savePlan(ds, o); };
  const d = fromIso(ds);
  const ws = wishes.slice().sort((a, b) => (b.meal === ml) - (a.meal === ml));
  return html`<${Sheet} title=${d.toLocaleDateString('de-DE', { weekday:'long', day:'numeric', month:'long' })} onClose=${onClose} wide>
    <div class="seg" role="group" aria-label="Mahlzeit">${MEALS.map(m => html`<button type="button" aria-pressed=${ml === m.id} onClick=${() => setMl(m.id)}><${Icon} n=${m.icon} size=${18} />${m.name}</button>`)}</div>
    <div class="field">Geplant zum ${mealName(ml)}
      ${items.length ? html`<div class="list">${items.map((x, i) => html`<div class="li"><span class="thumb"><${Art} k=${x.art} /></span>
        <div class="tx"><b>${x.dish}</b><span>${x.by && byId[x.by] ? 'Wunsch von ' + byId[x.by].name : ''}</span></div>

function Check(){
  const [mic, setMic] = useState('nicht getestet');

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rows = [
    ['Bildschirm', window.innerWidth + ' × ' + window.innerHeight + ' (' + (window.innerHeight > window.innerWidth ? 'Hochformat' : 'Querformat') + ')'],
    ['Browser', navigator.userAgent],
    ['Familienboard-App (APK)', window.FamilienboardApp ? 'ja – Sprache über Android' : 'nein'],
    ['Spracherkennung im Browser', SR ? 'vorhanden' : 'fehlt'],
    ['Mikrofon-Zugriff', navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'vorhanden' : 'fehlt'],
    ['Live-Verbindung', 'WebSocket' in window ? 'ja' : 'nein'],
    ['Anmeldung merken', (() => { try { localStorage.setItem('fb-t', '1'); localStorage.removeItem('fb-t'); return 'ja'; } catch (e) { return 'nein'; } })()]
  ];
  const testMic = async () => {
    try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); setMic('erlaubt'); }
    catch (e) { setMic('verweigert (' + (e && e.name) + ')'); }
  };
  const testSpeech = () => {
    if (window.FamilienboardApp) { window.onFamilienboardSpeech = t => setSaid(t ? 'Erkannt: „' + t + '“' : 'Nichts erkannt'); window.FamilienboardApp.startSpeech(); setSaid('Sprich jetzt …'); return; }
    if (!SR) { setSaid('Spracherkennung fehlt in diesem Browser.'); return; }
    try { const r = new SR(); r.lang = 'de-DE'; r.onresult = e => setSaid('Erkannt: „' + e.results[0][0].transcript + '“');
      r.onerror = e => setSaid('Fehler: ' + e.error); r.start(); setSaid('Sprich jetzt …'); } catch (e) { setSaid('Fehler: ' + e.message); }
  };
  return html`<div class="head"><div><h1>Gerätecheck</h1><div class="sub">Zeigt, was dieses Gerät kann. Schick Claude ein Foto davon.</div></div></div>
    <div class="card"><div class="list">${rows.map(r => html`<div class="li"><div class="tx"><b>${r[0]}</b><span style="white-space:normal">${r[1]}</span></div></div>`)}
      <div class="li"><div class="tx"><b>Mikrofon-Test</b><span>${mic}</span></div><button type="button" class="btn small" onClick=${testMic}>Testen</button></div>
      <div class="li"><div class="tx"><b>Sprach-Test</b><span style="white-space:normal">${said || 'nicht getestet'}</span></div><button type="button" class="btn small" onClick=${testSpeech}>Sprechen</button></div>
    </div></div>
    <a class="btn ghost" href="#heute">Zurück</a>`;
}

/* Häkchen von früher, deren Aufgabe es nicht mehr gibt (gelöscht oder verschoben) */
const logUnknown = e => e.kind === 'routine' && (!e.what || e.what === 'Routine');
const logWhat = e => logUnknown(e) ? 'Ältere Aufgabe' : e.what;
function StarStats({ id, now, points, week }){
  const all = useCol('starlog');
  const [fix, setFix] = useState(null); const [del, setDel] = useState(null); const [more, setMore] = useState(false);
  if (all === undefined) return html`<div class="stats"><div class="loading">Lädt …</div></div>`;
  const mine = all.filter(e => e.who === id).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.at || 0) - (a.at || 0));
  const sum = l => r2(l.reduce((s, e) => s + (e.stars || 0), 0));
  const mon = iso(monday(now)); const lastMon = iso(addDays(monday(now), -7));
  const thisW = (week || {})[id] || 0;
  const lastW = sum(mine.filter(e => e.date >= lastMon && e.date < mon));
  const days = [6,5,4,3,2,1,0].map(n => { const d = addDays(now, -n); const ds = iso(d); return { d, v: sum(mine.filter(e => e.date === ds)) }; });
  const mx = Math.max(1, ...days.map(x => x.v));
  const cnt = {}; mine.forEach(e => { if (logUnknown(e) || e.kind === 'alt') return; cnt[e.what] = (cnt[e.what] || 0) + 1; });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 6);
  const shown = more ? mine.slice(0, 100) : mine.slice(0, 12);
  return html`<div class="stats">
    <div class="tiles">
      <div class="tile"><b>${fmtS(thisW)}</b><span>Sterne diese Woche</span></div>
      <div class="tile"><b>${fmtS(lastW)}</b><span>Sterne letzte Woche</span></div>
      <div class="tile"><b>${mine.length}</b><span>Mal erledigt</span></div>

    </div>

    ${top.length ? html`<div class="field">Am häufigsten erledigt<div class="top">${top.map(w => html`<span>${w} · ${cnt[w]}×</span>`)}</div></div>` : null}

        <span class="ls">${e.stars ? html`<${Star} size=${16} />+${fmtS(e.stars)}` : html`<span style="font-size:12px;color:var(--muted)">ohne Stern</span>`}</span>
        ${fix === e.id ? html`<div class="row" style="gap:6px;width:100%"><span style="font-weight:800;font-size:14px">Wer hat es wirklich gemacht?</span>${MEMBERS.filter(m => m.id !== id).map(m => html`<button type="button" class="chip" onClick=${async () => { if (!(await needPin(e.who, 'Eintrag von ' + byId[e.who].name + ' ändern'))) return; logFix(e, m.id, mem_.docs['points/all'] || points); setFix(null); }}>${m.name}</button>`)}<button type="button" class="chip" onClick=${() => setFix(null)}>Abbrechen</button></div>`

function UpdateBar(){
  const [nv, setNv] = useState(null);
  useEffect(() => { const chk = async () => { try { const t = await fetch('index.html?u=' + Date.now(), { cache: 'no-store' }).then(r => r.text());
      const m = t.match(/const APP_VER = '(\d+)'/); if (m && m[1] !== APP_VER) setNv(m[1]); } catch (e) {} };
    const a = setTimeout(chk, 30000), b = setInterval(chk, 600000); return () => { clearTimeout(a); clearInterval(b); }; }, []);
  const go = () => { const u = new URL(location.href); u.searchParams.set('v', nv); location.replace(u.toString()); };
  useEffect(() => { if (!nv) return; let idle = 0; const reset = () => { idle = 0; };
    ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, reset));
    const t = setInterval(() => { idle += 15; const busy = document.querySelector('.overlay') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
      if (idle >= 120 && !busy) go(); }, 15000);
    return () => { clearInterval(t); ['pointerdown', 'keydown'].forEach(ev => window.removeEventListener(ev, reset)); }; }, [nv]);
  if (!nv) return null;
  return html`<button type="button" class="updbar" onClick=${go}><${Icon} n="undo" size=${18} />Neue Version da – tippen zum Aktualisieren</button>`;
}
const remBox = document.createElement('div'); document.body.appendChild(remBox); render(html`<${ReminderHost} />`, remBox);
const updBox = document.createElement('div'); document.body.appendChild(updBox); render(html`<${UpdateBar} />`, updBox);
/* Als App installierbar (ohne Browserleisten) */
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
const undoBox = document.createElement('div'); document.body.appendChild(undoBox); render(html`<${UndoBar} />`, undoBox);
/* Sichtbare Höhe merken, damit die Leiste unten immer zu sehen ist (auch wenn die Browserleiste ein-/ausfährt) */
const setNavH = () => { const n = document.querySelector('.nav'); if (n) document.documentElement.style.setProperty('--navh', n.offsetHeight + 'px'); };
setInterval(setNavH, 2000); window.addEventListener('resize', () => setTimeout(setNavH, 100));
const setAppH = () => { const a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return; document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px'); };
setAppH(); window.addEventListener('resize', setAppH); window.addEventListener('orientationchange', () => setTimeout(setAppH, 300));
})();
</script>
</body>
</html>
