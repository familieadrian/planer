<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5BD3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Familienboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: Wandtablet im Querformat – Menüleiste links, Inhalt rechts; am Handy Menüleiste unten */
:root{
  --font:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#EEF1F6;--surface:#FFFFFF;--surface-2:#F5F7FB;--line:#E2E6EE;--fg:#1E2430;--muted:#5B6577;
  --accent:#2F5BD3;--accent-fg:#FFFFFF;--accent-soft:#E6EDFC;--accent-ink:#1F44A8;
  --warn:#C2570C;--warn-soft:#FCE9D9;--warn-ink:#8F3E07;--ok-ink:#2F6418;--ok-soft:#EAF3E3;
  --danger:#C23B3B;--danger-soft:#FBE4E4;--star:#F2A93B;--star-line:#C9821A;--food-bg:#FFF4E5;--food-line:#F1E2CC;
  --on-m:#FFFFFF;--scrim:rgba(20,24,32,.45);
  --m-klaus:#3B5BA9;--t-klaus:#E3EAF8;--m-helena:#B83E6B;--t-helena:#F8E3EC;--m-dorothea:#0E7C7B;--t-dorothea:#DDF2F1;
  --m-marlene:#C2570C;--t-marlene:#FCE9D9;--m-clemens:#3F7D20;--t-clemens:#E4F2DA;--m-familie:#5B6577;--t-familie:#EEF1F6;
  --tone-0:#FBE3E1;--tone-1:#E1ECFB;--tone-2:#E8E5FA;--tone-3:#DFF1E5;--tone-4:#FFEFD3;--tone-5:#FAE3F1;--tone-6:#EAF3D8;--tone-7:#EFEBE5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151C;--surface:#1A2029;--surface-2:#222A35;--line:#2E3744;--fg:#E8ECF2;--muted:#9AA4B5;
  --accent:#6C8EF0;--accent-fg:#0E1420;--accent-soft:#22314F;--accent-ink:#B4C6F8;
  --warn:#F0A060;--warn-soft:#3A2A1C;--warn-ink:#F5C49A;--ok-ink:#A8D98C;--ok-soft:#1F2E1A;
  --danger:#E06565;--danger-soft:#3A1E1E;--star:#F2B44F;--star-line:#C9821A;--food-bg:#2A2218;--food-line:#3D3123;
  --on-m:#11151C;--scrim:rgba(0,0,0,.6);
  --m-klaus:#8FA8E8;--t-klaus:#24304A;--m-helena:#E58DB0;--t-helena:#3D2230;--m-dorothea:#5CC7C5;--t-dorothea:#173634;
  --m-marlene:#F0A060;--t-marlene:#3A2A1C;--m-clemens:#8FCB6B;--t-clemens:#22331A;--m-familie:#9AA4B5;--t-familie:#262E3A;
  --tone-0:#3A2422;--tone-1:#1F2C40;--tone-2:#2A2742;--tone-3:#1D3326;--tone-4:#3A2F1A;--tone-5:#3A2232;--tone-6:#26311A;--tone-7:#2E2B27;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151C;--surface:#1A2029;--surface-2:#222A35;--line:#2E3744;--fg:#E8ECF2;--muted:#9AA4B5;
  --accent:#6C8EF0;--accent-fg:#0E1420;--accent-soft:#22314F;--accent-ink:#B4C6F8;
  --warn:#F0A060;--warn-soft:#3A2A1C;--warn-ink:#F5C49A;--ok-ink:#A8D98C;--ok-soft:#1F2E1A;
  --danger:#E06565;--danger-soft:#3A1E1E;--star:#F2B44F;--star-line:#C9821A;--food-bg:#2A2218;--food-line:#3D3123;
  --on-m:#11151C;--scrim:rgba(0,0,0,.6);
  --m-klaus:#8FA8E8;--t-klaus:#24304A;--m-helena:#E58DB0;--t-helena:#3D2230;--m-dorothea:#5CC7C5;--t-dorothea:#173634;
  --m-marlene:#F0A060;--t-marlene:#3A2A1C;--m-clemens:#8FCB6B;--t-clemens:#22331A;--m-familie:#9AA4B5;--t-familie:#262E3A;
  --tone-0:#3A2422;--tone-1:#1F2C40;--tone-2:#2A2742;--tone-3:#1D3326;--tone-4:#3A2F1A;--tone-5:#3A2232;--tone-6:#26311A;--tone-7:#2E2B27;
  color-scheme:dark}
html,body{height:100%;margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
#root{height:100%}
.app{height:100%;display:flex}
.nav{width:104px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:20px;overflow:auto}
.logo{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.nav>a{width:84px;padding:10px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;font-size:13px;font-weight:700;color:var(--muted)}
.nav>a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:800}
.nav .sync{margin-top:auto;font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:0 8px;line-height:1.3}
.main{flex:1;min-width:0;overflow:auto;padding-block:22px 28px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{font-size:30px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:16px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{min-height:48px;padding:0 18px;border:none;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:44px;height:44px;flex-shrink:0;border:none;border-radius:12px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:14px;font-weight:800}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:5px;gap:4px;border:1px solid var(--line)}
.seg button{display:flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:8px 18px;min-height:44px;font-size:16px;font-weight:800;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--muted);min-width:0}
.field input,.field select,.input{height:48px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px;font-weight:700;color:var(--fg);background:var(--surface);box-sizing:border-box;width:100%;min-width:0}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;box-sizing:border-box}
.avatar-btn{width:52px;height:52px;font-size:19px;border:3px solid transparent}
.empty{border:2px dashed var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);font-weight:700}
.empty strong{color:var(--fg);font-size:17px}
.clock{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.todaychips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tchip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.tchip.exam{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink);font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:stretch;flex:1}
.col{background:var(--surface);border-radius:24px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.colhead{display:flex;align-items:center;gap:12px;padding-bottom:4px}
.colhead .avatar{width:52px;height:52px;font-size:22px;border:3px solid}
.colname{font-size:19px;font-weight:800}
.stars{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:800}
.task{display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 10px;border-radius:16px;box-sizing:border-box;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface)}
.task .ic{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.task .lbl{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.2}
.task .chk{width:30px;height:30px;flex-shrink:0;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:var(--surface)}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress>div{height:100%;border-radius:5px;transition:width .3s}
.done-badge{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:8px;font-size:15px;font-weight:800}
.iconpick{display:flex;flex-wrap:wrap;gap:4px}
.iconpick button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.iconpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.split{display:flex;gap:20px;align-items:flex-start}
.split>.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.split>aside{width:360px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;border:2px solid transparent;min-height:180px}
.day.today{border-color:var(--accent)}
.dayhead{display:flex;align-items:baseline;gap:6px;padding:0 4px 2px;font-weight:800}
.dayhead .n{font-size:26px}
.today .dayhead{color:var(--accent)}
.ev{border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;text-align:left;border:none;width:100%;color:var(--fg)}
.ev .t{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.ev .x{font-size:14px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.ev.exam{background:var(--warn-soft)}
.ev.exam .x{color:var(--warn-ink)}
.addday{border:none;background:transparent;color:var(--muted);border-radius:10px;min-height:36px;font-weight:800;font-size:13px;margin-top:auto}
.tt{display:grid;gap:8px}
.tt .h{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:8px 0;border-radius:12px;background:var(--surface-2);font-weight:800}
.tt .h.today{background:var(--accent);color:var(--accent-fg)}
.tt .tm{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.tt .tm small{font-size:12px;color:var(--muted);font-weight:700}
.cell{position:relative;min-height:56px;border-radius:14px;border:3px solid transparent;display:flex;align-items:center;justify-content:center;padding:4px 8px;text-align:center;font-size:15px;font-weight:800;color:var(--fg);overflow-wrap:anywhere}
.cell.empty-cell{background:transparent;border:2px dashed var(--line);color:var(--muted);font-weight:600}
.cell.exam{border-color:var(--warn)}
.cell .badge{position:absolute;top:-10px;right:6px;background:var(--warn);color:var(--on-m);font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;background:var(--surface-2);min-width:0}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li .tx b{font-size:16px}
.li .tx span{font-size:13px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{flex-shrink:0;font-size:13px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--surface);color:var(--muted)}
.count.soon{background:var(--warn-soft);color:var(--warn-ink)}
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 6px 6px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-width:0}
.item>button.main-tap{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:none;background:transparent;text-align:left;padding:4px 0;min-height:44px}
.item .circle{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.item.done{background:var(--surface-2);border-color:transparent}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item.done .circle{background:var(--accent);border-color:var(--accent)}
.nm{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.mic{width:56px;height:56px;flex-shrink:0;border:none;border-radius:16px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center}
.mic.on{background:var(--danger);color:#FFFFFF}
.mic.on svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.mic.on svg{animation:none}.progress>div{transition:none}}
.hint{padding:10px 14px;border-radius:14px;font-size:14px;font-weight:700;background:var(--ok-soft);color:var(--ok-ink)}
.hint.warn{background:var(--warn-soft);color:var(--warn-ink)}
.meals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.meal{background:var(--surface);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;border:3px solid transparent;text-align:left;color:var(--fg);min-width:0}
.meal.today{border-color:var(--accent)}
.meal .mh{display:flex;align-items:baseline;justify-content:space-between;font-weight:800}
.meal .mh small{font-size:13px;color:var(--muted);font-weight:700}
.meal .pic{border-radius:16px;background:var(--food-bg);aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.meal .pic.none{border:2px dashed var(--food-line);background:transparent;color:var(--muted);font-weight:800;font-size:14px}
.meal .dish{font-size:16px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.art{display:block;width:78%;max-width:100%}
.art svg{display:block;width:100%;height:auto}
.foods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.food{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:16px;border:2px solid var(--food-line);background:var(--food-bg);color:var(--fg)}
.food .art{width:100%}
.food span{font-size:12px;font-weight:800;line-height:1.15;text-align:center}
.thumb{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--food-bg);display:flex;align-items:center;justify-content:center}
.thumb .art{width:40px}
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:24px;padding:20px;width:100%;max-width:620px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.sheet.wide{max-width:900px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet .sh h2{font-size:22px;font-weight:800}
.shot{max-height:220px;max-width:100%;border-radius:14px;border:1px solid var(--line);object-fit:contain;align-self:flex-start}
.file{display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;border:2px dashed var(--line);border-radius:18px;font-weight:800;color:var(--muted);cursor:pointer;text-align:center;padding:12px}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.check{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2);font-weight:700}
.check input{width:22px;height:22px;margin-top:2px;flex-shrink:0}
.ovx{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.loading{color:var(--muted);font-weight:700;padding:12px}
@media (max-width:1100px){.cols{grid-template-columns:repeat(3,minmax(0,1fr))}.meals{grid-template-columns:repeat(3,minmax(0,1fr))}.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (orientation:portrait) and (min-width:821px){
  .app{flex-direction:column}
  .nav{order:2;width:auto;flex-direction:row;justify-content:space-around;border-right:none;border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));gap:8px;overflow:visible}
  .nav .logo{display:none}
  .nav>a{flex:1;max-width:180px;padding:12px 0;font-size:16px}
  .nav .sync{margin:0;align-self:center;width:110px}
  .main{order:1;flex:1;min-height:0}
  .cols{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .col{padding:14px 10px}
  .task{position:relative;flex-direction:column;justify-content:center;text-align:center;gap:8px;min-height:120px;padding:12px 6px}
  .task .ic{width:56px;height:56px}
  .task .lbl{flex:0 0 auto;width:100%;font-size:16px;overflow-wrap:anywhere;hyphens:auto}
  .task .chk{position:absolute;top:8px;right:8px;width:26px;height:26px}
  .week{grid-template-columns:repeat(4,minmax(0,1fr))}
  .split{flex-direction:column;align-items:stretch}
  .split>aside{width:auto}
  .split>aside:not(.card){display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
  .meals{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{flex-direction:column}
  .nav{position:fixed;left:0;right:0;bottom:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));border-right:none;border-top:1px solid var(--line);z-index:40;gap:2px}
  .nav .logo,.nav .sync{display:none}
  .nav>a{width:auto;flex:1;padding:6px 0;font-size:12px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 100px;overflow:visible}
  .app{height:auto;min-height:100%}
  .cols{grid-template-columns:1fr}
  .split{flex-direction:column;align-items:stretch}
  .split>aside{width:auto}
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .meals{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shop{grid-template-columns:1fr}
  .clock{font-size:32px}
  .head h1{font-size:26px}
}
/* ---------- Bus-Ampel ---------- */
.buses{display:flex;flex-direction:column;gap:10px}
.bus{display:flex;align-items:center;gap:18px;padding:14px 20px;border-radius:24px;border:3px solid var(--line);background:var(--surface)}

const levelIdx = n => { let i = 0; LEVELS.forEach((l, k) => { if ((n || 0) >= l.at) i = k; }); return i; };

  if (t.repeat === 'daily') return !t.date || ds >= t.date;

  if (ds === today) return t.done && t.done.once ? t.doneOn === today : (!t.date || t.date <= today) && (!t.until || today <= t.until);

  if (points === undefined) { toast('Einen Moment, Sterne werden noch geladen …'); return; }
  const k = todoKey(t, ds); const done = Object.assign({}, t.done || {}); const prev = done[k]; const st = t.stars || 1; const dl = {};
  if (prev) { dl[prev] = -st; delete done[k]; }
  if (who) { done[k] = who; dl[who] = (dl[who] || 0) + st; }
  const body = Object.assign({}, t, { done }); delete body.id;
  if (k === 'once') body.doneOn = who ? ds : null;
  S.set('todos/' + t.id, body); givePoints(points, dl);
}
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const normTime = v => { const s = String(v || '').trim().replace(/[^\d:.]/g, ''); if (!s) return '';
  let h, m; const parts = s.split(/[:.]/);
  if (parts.length > 1) { h = +parts[0]; m = +(parts[1] || 0); } else if (s.length <= 2) { h = +s; m = 0; } else { h = +s.slice(0, -2); m = +s.slice(-2); }
  if (isNaN(h) || isNaN(m) || h > 23 || m > 59) return null; return pad(h) + ':' + pad(m); };

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1800, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej({ code:'image_rejected' }); };
    img.src = u;
  });
}
function parseJson(t){
  const s = String(t || '').trim();
  try { return JSON.parse(s); } catch (e) {}
  const f = s.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = s.search(/[\[{]/), b = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch (e) {} }
  throw { code:'invalid_json' };
}

function TypePreview(){
  const [st, setSt] = useState(null);
  const [pos, setPos] = useState('top:0');
  useEffect(() => {
    let cur = null, maxH = window.innerHeight;
    const ok = el => el && ((el.tagName === 'INPUT' && !/^(checkbox|radio|file|button|submit|range|color|hidden)$/i.test(el.type)) || el.tagName === 'TEXTAREA');
    const lab = el => { const l = el.getAttribute('aria-label') || (el.labels && el.labels[0] && el.labels[0].firstChild && el.labels[0].firstChild.nodeType === 3 ? el.labels[0].firstChild.textContent : '') || el.placeholder || 'Eingabe'; return l.trim(); };
    const place = () => { const vv = window.visualViewport; const ih = window.innerHeight;
      if (!cur) maxH = Math.max(maxH, ih);
      if (vv && ih - vv.height > 120) setPos('bottom:' + Math.max(0, Math.round(ih - (vv.offsetTop + vv.height))) + 'px');
      else if (maxH - ih > 120) setPos('bottom:0');
      else setPos('top:0'); };
    const upd = () => { if (!cur) return; const v = cur.type === 'password' ? cur.value.replace(/./g, '•') : cur.value; setSt({ label: lab(cur), val: v.length > 60 ? '…' + v.slice(-60) : v, ph: cur.placeholder || '' }); place(); };
    const fin = e => { if (ok(e.target)) { cur = e.target; upd(); setTimeout(place, 400); } };
    const fout = e => { if (e.target === cur) setTimeout(() => { if (document.activeElement !== cur) { cur = null; setSt(null); } }, 80); };
    const inp = e => { if (e.target === cur) upd(); };
    document.addEventListener('focusin', fin); document.addEventListener('focusout', fout); document.addEventListener('input', inp, true);
    const vv = window.visualViewport; if (vv) { vv.addEventListener('resize', place); vv.addEventListener('scroll', place); }
    window.addEventListener('resize', place);
    return () => { document.removeEventListener('focusin', fin); document.removeEventListener('focusout', fout); document.removeEventListener('input', inp, true);
      if (vv) { vv.removeEventListener('resize', place); vv.removeEventListener('scroll', place); } window.removeEventListener('resize', place); };
  }, []);
  if (!st) return null;
  return html`<div class="typeprev" style=${pos} aria-hidden="true"><span class="tl">${st.label}</span>
    <span class="tv">${st.val ? st.val : html`<span class="tph">${st.ph}</span>`}<span class="caret"></span></span></div>`;
}

function EventImport({ now, onClose }){
  const [file, setFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [found, setFound] = useState(null);
  const [pick, setPick] = useState({});
  const run = async () => {
    setBusy(true); setErr(''); setFound(null);
    const prompt = 'Heute ist ' + iso(now) + ' (' + WD[now.getDay()] + '). Das Bild ist ein Screenshot oder Foto mit Terminen (z. B. Elternbrief, Einladung, Vereinsplan, Kalender, Nachricht). ' +
      'Familie: Klaus (Papa), Helena (Mama), Dorothea (9, Schule), Marlene (6, Schule), Clemens (4). Lies alle Termine aus. ' +
      'Antworte nur mit JSON: {"events":[{"title":string,"date":"YYYY-MM-DD","time":"HH:MM" oder null,"end":"HH:MM" oder null,"who":"klaus"|"helena"|"dorothea"|"marlene"|"clemens"|"familie","exam":boolean,"fach":string oder null,"note":string oder null}]}. ' +
      'Regeln: Fehlt das Jahr, nimm das nächste Datum ab heute. "who" nur setzen, wenn eindeutig eine Person gemeint ist, sonst "familie". exam=true nur bei Klassenarbeit/Probe/Test/Schulaufgabe eines Kindes, dann "fach" = Schulfach. Titel kurz auf Deutsch. Keine Termine erfinden; wenn keine da sind: {"events":[]}.';
    try {
      const res = await readImage(file, prompt);
      const list = (res && Array.isArray(res.events) ? res.events : []).filter(e => e && e.title && /^\d{4}-\d{2}-\d{2}$/.test(e.date || ''))
        .map(e => Object.assign({}, e, { who: byId[e.who] ? e.who : 'familie' }));
      setFound(list); const p = {}; list.forEach((e,i) => p[i] = true); setPick(p);
      if (!list.length) setErr('Im Bild wurden keine Termine gefunden.');
    } catch (e) { setErr(sampleErr(e)); }
    setBusy(false);
  };
  const save = () => {
    let n = 0;
    found.forEach((e,i) => { if (!pick[i]) return; n++;
      if (e.exam && byId[e.who] && byId[e.who].school) S.add('exams', { kid: e.who, fach: e.fach || e.title, datum: e.date, thema: e.note || '' });
      else S.add('events', { title: e.title, date: e.date, time: e.time || null, end: e.end || null, who: e.who, note: e.note || null, source:'screenshot' });
    });
    toast(n + (n === 1 ? ' Termin' : ' Termine') + ' gespeichert'); onClose();
  };
  return html`<${Sheet} title="Termine per Screenshot" onClose=${onClose} wide>
    <${FilePick} file=${file} setFile=${f => { setFile(f); setFound(null); setErr(''); }} label="Screenshot oder Foto wählen (Elternbrief, Einladung, Plan …)" />
    ${!found ? html`<button type="button" class="btn" disabled=${!file || busy} onClick=${run}>${busy ? 'Wird gelesen … (kann bis zu einer Minute dauern)' : 'Termine erkennen'}</button>` : null}
    ${err ? html`<div class="hint warn" role="alert">${err}</div>` : null}
    ${found && found.length ? html`<div class="list">
      ${found.map((e,i) => html`<label class="check"><input type="checkbox" checked=${!!pick[i]} onChange=${ev => setPick(Object.assign({}, pick, { [i]: ev.target.checked }))} />
        <span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:800">${e.exam ? 'Klassenarbeit: ' : ''}${e.title}</span>
        <span class="sub" style="font-size:14px">${fromIso(e.date).toLocaleDateString('de-DE', { weekday:'short', day:'numeric', month:'long' })}${e.time ? ', ' + e.time + ' Uhr' : ', ganztags'} · ${byId[e.who].name}</span></span>
        <${Avatar} id=${e.who} size=${32} /></label>`)}
      <button type="button" class="btn" onClick=${save}>Ausgewählte übernehmen</button>
    </div>` : null}
  <//>`;
}

function TimetableImport({ kid, onClose }){
  const [file, setFile] = useState(null); const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [res, setRes] = useState(null);
  const run = async () => {
    setBusy(true); setErr(''); setRes(null);
    const prompt = 'Das Bild zeigt den Schul-Stundenplan eines Grundschulkindes (Montag bis Freitag). Lies ihn genau aus. ' +
      'Antworte nur mit JSON: {"times":["8:00","8:45",...],"days":[[...],[...],[...],[...],[...]]}. ' +
      '"times" = Beginn jeder Unterrichtsstunde (Zeile) von oben nach unten; sind keine Zeiten zu sehen, nimm "". ' +
      '"days" = genau 5 Listen (Mo, Di, Mi, Do, Fr), jede so lang wie "times": Fachname kurz auf Deutsch (z. B. "Deutsch", "Mathe", "Sport", "Kunst") oder null, wenn frei. Pausen als eigene Zeilen weglassen. Höchstens 10 Zeilen.';
    try {
      const r = await readImage(file, prompt);
      if (!r || !Array.isArray(r.times) || !Array.isArray(r.days) || !r.times.length) throw { code:'invalid_json' };
      const n = Math.min(r.times.length, 10);
      const days = [0,1,2,3,4].map(i => { const d = Array.isArray(r.days[i]) ? r.days[i] : []; return Array.from({ length: n }, (x, j) => (d[j] ? String(d[j]).trim() : null)); });
      setRes({ times: r.times.slice(0, n).map(t => (t ? String(t) : '')), days });
    } catch (e) { setErr(sampleErr(e)); }
    setBusy(false);
  };
  return html`<${Sheet} title=${'Stundenplan einlesen · ' + byId[kid].name} onClose=${onClose} wide>
    <${FilePick} file=${file} setFile=${f => { setFile(f); setRes(null); setErr(''); }} label="Foto oder Screenshot vom Stundenplan wählen" />
    ${!res ? html`<button type="button" class="btn" disabled=${!file || busy} onClick=${run}>${busy ? 'Wird gelesen … (kann bis zu einer Minute dauern)' : 'Stundenplan erkennen'}</button>` : null}
    ${err ? html`<div class="hint warn" role="alert">${err}</div>` : null}
    ${res ? html`<div class="hint">Bitte kurz prüfen. Einzelne Stunden kannst du danach antippen und ändern.</div>
      <div class="ovx"><div class="tt" style="grid-template-columns:56px repeat(5,minmax(90px,1fr));min-width:520px">
        <div></div>${['Mo','Di','Mi','Do','Fr'].map(d => html`<div class="h">${d}</div>`)}
        ${res.times.map((t, ri) => html`<div class="tm"><span>${ri+1}.</span><small>${t}</small></div>
          ${res.days.map(d => html`<div class=${'cell' + (d[ri] ? '' : ' empty-cell')} style=${d[ri] ? 'background:var(--tone-' + toneOf(d[ri]) + ')' : ''}>${d[ri] || '–'}</div>`)}`)}
      </div></div>
      <div class="row"><button type="button" class="btn" onClick=${() => { S.set('timetables/' + kid, Object.assign({ updatedAt: Date.now() }, res)); toast('Stundenplan gespeichert'); onClose(); }}>Übernehmen</button>
        <button type="button" class="btn ghost" onClick=${() => setRes(null)}>Nochmal einlesen</button></div>` : null}
  <//>`;
}

  const addMany = names => names.forEach(n => S.add('shopping', { name: n, by: who, done: false }));
  const splitWords = t => t.replace(/^(wir brauchen( noch)?|ich brauche|bitte|kauf( mal)?)\s+/i,'').split(/,|\bund\b|\bsowie\b/i).map(s => s.trim().replace(/[.!?]+$/,'')).filter(Boolean).map(s => s[0].toUpperCase() + s.slice(1));

  useEffect(() => { if (voice.fallback && inputRef.current) inputRef.current.focus(); }, [voice.fallback]);

        </form>

/* ---------- Gerätecheck (z. B. für den Kühlschrank) ---------- */
function Check(){
  const [mic, setMic] = useState('nicht getestet');
  const [said, setSaid] = useState('');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rows = [
    ['Bildschirm', window.innerWidth + ' × ' + window.innerHeight + ' (' + (window.innerHeight > window.innerWidth ? 'Hochformat' : 'Querformat') + ')'],
    ['Browser', navigator.userAgent],
    ['Familienboard-App (APK)', window.FamilienboardApp ? 'ja – Sprache über Android' : 'nein'],
    ['Spracherkennung im Browser', SR ? 'vorhanden' : 'fehlt'],
    ['Mikrofon-Zugriff', navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'vorhanden' : 'fehlt'],
    ['Live-Verbindung', 'WebSocket' in window ? 'ja' : 'nein'],
    ['Anmeldung merken', (() => { try { localStorage.setItem('fb-t', '1'); localStorage.removeItem('fb-t'); return 'ja'; } catch (e) { return 'nein'; } })()]
  ];
  const testMic = async () => {
    try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); setMic('erlaubt'); }
    catch (e) { setMic('verweigert (' + (e && e.name) + ')'); }
  };
  const testSpeech = () => {
    if (window.FamilienboardApp) { window.onFamilienboardSpeech = t => setSaid(t ? 'Erkannt: „' + t + '“' : 'Nichts erkannt'); window.FamilienboardApp.startSpeech(); setSaid('Sprich jetzt …'); return; }
    if (!SR) { setSaid('Spracherkennung fehlt in diesem Browser.'); return; }
    try { const r = new SR(); r.lang = 'de-DE'; r.onresult = e => setSaid('Erkannt: „' + e.results[0][0].transcript + '“');
      r.onerror = e => setSaid('Fehler: ' + e.error); r.start(); setSaid('Sprich jetzt …'); } catch (e) { setSaid('Fehler: ' + e.message); }
  };
  return html`<div class="head"><div><h1>Gerätecheck</h1><div class="sub">Zeigt, was dieses Gerät kann. Schick Claude ein Foto davon.</div></div></div>
    <div class="card"><div class="list">${rows.map(r => html`<div class="li"><div class="tx"><b>${r[0]}</b><span style="white-space:normal">${r[1]}</span></div></div>`)}
      <div class="li"><div class="tx"><b>Mikrofon-Test</b><span>${mic}</span></div><button type="button" class="btn small" onClick=${testMic}>Testen</button></div>
      <div class="li"><div class="tx"><b>Sprach-Test</b><span style="white-space:normal">${said || 'nicht getestet'}</span></div><button type="button" class="btn small" onClick=${testSpeech}>Sprechen</button></div>
    </div></div>
    <a class="btn ghost" href="#heute">Zurück</a>`;
}

function Sterne({ now }){
  const points = useDoc('points/all');
  const week = useDoc(weekDoc(now));
  const claims = useDoc('rewards/claims');
  const custom = useDoc('config/rewards');
  const [mode, setMode] = useState('woche');
  const [sel, setSel] = useState('dorothea');
  const [edit, setEdit] = useState(false);
  const P = points || {}, W = week || {}, C = claims || {}, R = custom || {};
  const rw = l => ((R.levels || {})[l.at]) || l.reward;
  const fr = g => ((R.family || {})[g.at]) || g.reward;
  const val = id => mode === 'woche' ? (W[id] || 0) : (P[id] || 0);
  const ranked = MEMBERS.slice().sort((a, b) => val(b.id) - val(a.id) || (P[b.id] || 0) - (P[a.id] || 0));
  let rk = 0, lastV = null; const ranks = ranked.map((m, i) => { const v = val(m.id); if (v !== lastV) { rk = i + 1; lastV = v; } return rk; });
  const total = MEMBERS.reduce((s, m) => s + (P[m.id] || 0), 0);
  const nextGoal = FAMILY_GOALS.find(g => total < g.at);
  const prevGoalAt = FAMILY_GOALS.filter(g => total >= g.at).reduce((s, g) => g.at, 0);
  const claim = (who, at) => { const c = Object.assign({}, C); c[who] = Object.assign({}, c[who] || {}, { [at]: iso(now) }); S.set('rewards/claims', c); toast('Belohnung eingelöst – viel Spaß!'); };
  const unclaim = (who, at) => { const c = Object.assign({}, C); c[who] = Object.assign({}, c[who] || {}); delete c[who][at]; S.set('rewards/claims', c); };
  const sp = P[sel] || 0; const si = levelIdx(sp);
  if (points === undefined) return html`<div class="loading">Sterne werden geladen …</div>`;
  return html`
    <div class="head">
      <div><h1>Sterne & Level</h1><div class="sub">Sterne gibt es für Routinen und für Aufgaben für alle.</div></div>
      <div class="row">
        <div class="seg" role="group" aria-label="Zeitraum">
          <button type="button" aria-pressed=${mode === 'woche'} onClick=${() => setMode('woche')}>Diese Woche</button>
          <button type="button" aria-pressed=${mode === 'gesamt'} onClick=${() => setMode('gesamt')}>Insgesamt</button>
        </div>
        <button type="button" class="btn small ghost" onClick=${() => setEdit(true)}><${Icon} n="edit" size=${16} />Belohnungen</button>
      </div>
    </div>
    <div class="split">
      <div class="grow">
        <div class="lb">${ranked.map((m, i) => { const tp = P[m.id] || 0; const li = levelIdx(tp); const nx = LEVELS[li + 1];
          const pct = nx ? Math.round((tp - LEVELS[li].at) / (nx.at - LEVELS[li].at) * 100) : 100;
          return html`<button type="button" class="lbrow" aria-pressed=${sel === m.id} onClick=${() => setSel(m.id)} aria-label=${'Platz ' + ranks[i] + ': ' + m.name + ', ' + val(m.id) + ' Sterne'}>
            <span class=${'rank' + (val(m.id) > 0 && ranks[i] <= 3 ? ' r' + ranks[i] : '')}>${ranks[i]}</span>
            <${Avatar} id=${m.id} size=${52} ring=${true} />
            <span class="lbx">
              <span class="lbn">${m.name}<span class="lvl">Level ${li + 1} · ${LEVELS[li].name}</span></span>
              <span class="progress" style="height:12px"><span style=${'display:block;height:100%;border-radius:6px;width:' + pct + '%;background:' + mc(m.id)}></span></span>
              <span class="lbnext">${nx ? 'Noch ' + (nx.at - tp) + ' bis Level ' + (li + 2) + ': ' + rw(nx) : 'Höchstes Level erreicht!'}</span>
            </span>
            <span class="lbs"><${Star} size=${28} />${val(m.id)}</span>
          </button>`; })}</div>
        <div class="card">
          <h2 style="font-size:20px;display:flex;align-items:center;gap:8px"><${Icon} n="home" size=${22} />Familienziel</h2>
          <div class="sub" style="font-size:14px">Alle sammeln zusammen: <b style="color:var(--fg)">${total} Sterne</b>${nextGoal ? ' · noch ' + (nextGoal.at - total) + ' bis „' + fr(nextGoal) + '“' : ' · alle Ziele geschafft!'}</div>
          ${nextGoal ? html`<div class="progress" style="height:14px"><div style=${'width:' + Math.round((total - prevGoalAt) / (nextGoal.at - prevGoalAt) * 100) + '%;background:var(--star)'}></div></div>` : null}
          <div class="ladder">${FAMILY_GOALS.map(g => { const got = total >= g.at; const c = (C.familie || {})[g.at];
            return html`<div class=${'step' + (got ? ' got' : ' locked')}><span class="sn">${g.at}<small>Sterne</small></span>
              <span class="sx"><b>${fr(g)}</b><span>${got ? (c ? 'Eingelöst am ' + fromIso(c).toLocaleDateString('de-DE') : 'Geschafft! Jetzt einlösen.') : 'Noch ' + (g.at - total) + ' Sterne'}</span></span>
              ${got ? (c ? html`<button type="button" class="claimed" onClick=${() => unclaim('familie', g.at)} aria-label="Einlösen rückgängig">Eingelöst</button>` : html`<button type="button" class="btn small" onClick=${() => claim('familie', g.at)}>Einlösen</button>`) : null}</div>`; })}</div>
        </div>
      </div>
      <aside>
        <div class="card">
          <div class="row"><${Avatar} id=${sel} size=${44} ring=${true} /><div><h2 style="font-size:20px">${byId[sel].name}</h2><div class="sub" style="font-size:14px">${sp} Sterne · Level ${si + 1} ${LEVELS[si].name}</div></div></div>
          <div class="ladder">${LEVELS.slice(1).map((l, j) => { const got = sp >= l.at; const c = (C[sel] || {})[l.at]; const isNext = !got && levelIdx(sp) === j;
            return html`<div class=${'step' + (got ? ' got' : isNext ? '' : ' locked')}><span class="sn">${j + 2}<small>${l.at} ★</small></span>
              <span class="sx"><b>${l.name}: ${rw(l)}</b><span>${got ? (c ? 'Eingelöst am ' + fromIso(c).toLocaleDateString('de-DE') : 'Erreicht!') : 'Noch ' + (l.at - sp) + ' Sterne'}</span></span>
              ${got ? (c ? html`<button type="button" class="claimed" onClick=${() => unclaim(sel, l.at)} aria-label="Einlösen rückgängig">Eingelöst</button>` : html`<button type="button" class="btn small" onClick=${() => claim(sel, l.at)}>Einlösen</button>`) : null}</div>`; })}</div>
          <div class="sub" style="font-size:13px">Belohnungen lösen Mama oder Papa zusammen mit dem Kind ein. Gesammelte Sterne bleiben erhalten.</div>
        </div>
      </aside>
    </div>
    ${edit ? html`<${RewardEdit} R=${R} rw=${rw} fr=${fr} onClose=${() => setEdit(false)} />` : null}`;
}
function RewardEdit({ R, rw, fr, onClose }){
  const [lv, setLv] = useState(() => { const o = {}; LEVELS.slice(1).forEach(l => o[l.at] = rw(l)); return o; });
  const [fa, setFa] = useState(() => { const o = {}; FAMILY_GOALS.forEach(g => o[g.at] = fr(g)); return o; });
  const save = () => { S.set('config/rewards', { levels: lv, family: fa }); toast('Belohnungen gespeichert'); onClose(); };
  return html`<${Sheet} title="Belohnungen anpassen" onClose=${onClose} wide>
    <div class="sub" style="font-size:14px">Trage ein, was es bei jedem Level gibt. Gilt für alle in der Familie.</div>
    ${LEVELS.slice(1).map((l, j) => html`<label class="field">Level ${j + 2} · ${l.name} (ab ${l.at} Sternen)<input value=${lv[l.at]} onInput=${e => setLv(Object.assign({}, lv, { [l.at]: e.target.value }))} /></label>`)}
    <h3 style="font-size:16px">Familienziele</h3>
    ${FAMILY_GOALS.map(g => html`<label class="field">Ab ${g.at} Sternen zusammen<input value=${fa[g.at]} onInput=${e => setFa(Object.assign({}, fa, { [g.at]: e.target.value }))} /></label>`)}
    <div class="row"><button type="button" class="btn" onClick=${save}>Speichern</button><button type="button" class="btn ghost" onClick=${onClose}>Abbrechen</button></div>
  <//>`;
}
const VIEWS = [
  { id:'heute', label:'Heute', icon:'star' },
  { id:'kalender', label:'Kalender', icon:'cal' },
  { id:'schule', label:'Schule', icon:'school' },
  { id:'einkauf', label:'Einkauf', icon:'cart' },
  { id:'essen', label:'Essen', icon:'fork' },
  { id:'sterne', label:'Sterne', icon:'trophy' }
];
function App(){
  const fromHash = () => { const h = (location.hash || '').slice(1); return VIEWS.some(v => v.id === h) || h === 'check' ? h : 'heute'; };
  const [view, setView] = useState(fromHash());
  const [msg, setMsg] = useState('');
  const [auth, setAuth] = useState(CONFIGURED && sb ? 'wait' : 'unconfigured');
  const [ready, setReady] = useState(false);
  const [loadErr, setLoadErr] = useState('');
  const now = useNow();
  useEffect(() => { const h = () => setView(fromHash()); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  useEffect(() => { let t; const h = e => { setMsg(e.detail); clearTimeout(t); t = setTimeout(() => setMsg(''), 3200); }; window.addEventListener('fb-toast', h); return () => window.removeEventListener('fb-toast', h); }, []);
  useEffect(() => { if (!sb) return; sb.auth.getSession().then(r => setAuth(r.data && r.data.session ? 'in' : 'out')); }, []);
  useEffect(() => { if (auth !== 'in') return; startSync().then(() => setReady(true)).catch(e => { console.error(e); setLoadErr('Die Daten konnten nicht geladen werden. Ist die Tabelle angelegt (Anleitung Schritt 2)?'); }); }, [auth]);
  useEffect(() => { const wake = () => { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} };
    document.addEventListener('click', wake, { once: true }); }, []);
  if (auth === 'unconfigured') return html`<div class="main"><div class="card"><h1 style="font-size:24px">Fast geschafft</h1>
    <div>In der Datei <b>index.html</b> fehlen noch die Supabase-Adresse und der Schlüssel (Anleitung Schritt 3).</div></div>
    ${view === 'check' ? html`<${Check} />` : html`<a class="btn ghost" href="#check">Gerätecheck öffnen</a>`}</div>`;
  if (auth === 'wait') return html`<div class="loading" style="padding:24px">Familienboard wird geladen …</div>`;
  if (auth === 'out') return html`<${Login} onDone=${() => setAuth('in')} />`;
  const V = view === 'check' ? Check : { heute: Heute, kalender: Kalender, schule: Schule, einkauf: Einkauf, essen: Essen, sterne: Sterne }[view];
  return html`<div class="app">
    <nav class="nav" aria-label="Hauptmenü">
      <div class="logo"><${Icon} n="home" size=${28} sw=${2.2} /></div>
      ${VIEWS.map(v => html`<a href=${'#' + v.id} aria-current=${view === v.id ? 'page' : undefined} onClick=${() => setView(v.id)}><${Icon} n=${v.icon} size=${26} />${v.label}</a>`)}
      <div class="sync">${ready ? 'Synchron auf allen Geräten' : 'Verbinde …'}<br /><a href="#check" style="width:auto;padding:4px 0;font-size:11px;display:inline">Gerätecheck</a></div>
    </nav>
    <main class="main">
      ${loadErr ? html`<div class="hint warn" role="alert">${loadErr}</div>` : null}
      <${V} now=${now} />
    </main>
    ${msg ? html`<div class="toast" role="status">${msg}</div>` : null}
  </div>`;
}
render(html`<${App} />`, document.getElementById('root'));
const tpBox = document.createElement('div'); document.body.appendChild(tpBox); render(html`<${TypePreview} />`, tpBox);
/* Sichtbare Höhe merken, damit die Leiste unten immer zu sehen ist (auch wenn die Browserleiste ein-/ausfährt) */
const setAppH = () => { const a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return; document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px'); };
setAppH(); window.addEventListener('resize', setAppH); window.addEventListener('orientationchange', () => setTimeout(setAppH, 300));
})();
</script>
